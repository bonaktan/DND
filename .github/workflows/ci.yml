name: CI and release

on:
  push:
    branches: [main]
    tags: ['[0-9]*.[0-9]*.[0-9]*']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Lint, format check, and test
    if: >-
      github.event_name == 'pull_request' ||
      (github.ref_type == 'branch' && github.event.deleted == false) ||
      (github.ref_type == 'tag' && github.event.created == true)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      release-commit: ${{ steps.tag.outputs.commit }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
      reuse-ci: ${{ steps.prior-ci.outputs.passed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: ${{ github.ref_type == 'tag' && '0' || '1' }}
          persist-credentials: false

      - name: Validate release tag
        if: github.ref_type == 'tag'
        id: tag
        shell: bash
        run: |
          number='(0|[1-9][0-9]*)'
          identifier="($number|[0-9]*[A-Za-z-][0-9A-Za-z-]*)"
          semver="^$number\.$number\.$number(-$identifier(\.$identifier)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$"
          if [[ ! $GITHUB_REF_NAME =~ $semver ]]; then
            echo "::error::Release tags must be bare SemVer 2.0.0 versions, such as 1.2.3."
            exit 1
          fi

          commit=$(git rev-parse HEAD)
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo "::error::The tagged commit must already be reachable from main."
            exit 1
          fi

          prerelease=false
          if [[ ${GITHUB_REF_NAME%%+*} == *-* ]]; then
            prerelease=true
          fi
          {
            echo "commit=$commit"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Check tag matches application version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          version=$(./gradlew --no-daemon -q :app:printVersion)
          if [[ "$GITHUB_REF_NAME" != "$version" ]]; then
            echo "::error::Release tag must match the Gradle application version ($version)."
            exit 1
          fi

      - name: Look for successful CI on the tagged commit
        if: github.ref_type == 'tag'
        id: prior-ci
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAGGED_COMMIT: ${{ steps.tag.outputs.commit }}
        run: |
          if ! run_url=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f branch=main -f event=push -f status=success -f head_sha="$TAGGED_COMMIT" \
            -F per_page=1 --jq '.workflow_runs[0].html_url // empty'); then
            echo "::warning::Could not look up prior CI. Running all checks."
          elif [[ -n "$run_url" ]]; then
            echo "Reusing successful CI: $run_url"
            echo "passed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Java lint, formatting checks, and JUnit tests
        if: steps.prior-ci.outputs.passed != 'true'
        run: ./gradlew --no-daemon :app:check

      - name: Generate Javadoc
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: ./gradlew --no-daemon :app:javadoc

      - name: Generate Wiki API reference
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python3 .github/scripts/javadoc-to-wiki.py app/build/docs/javadoc app/build/API-Reference.md

      - uses: actions/upload-artifact@v7
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: javadoc-wiki
          path: app/build/API-Reference.md
          if-no-files-found: error

      - name: Package desktop app
        if: steps.tag.outputs.commit != ''
        run: |
          ./gradlew --no-daemon :app:distZip
          mv app/build/distributions/app.zip DND.zip

      - uses: actions/upload-artifact@v7
        if: steps.tag.outputs.commit != ''
        with:
          name: desktop-distribution
          path: DND.zip
          if-no-files-found: error
          overwrite: true

  verify-desktop:
    name: Build and test (${{ matrix.os }})
    needs: verify
    if: needs.verify.outputs.reuse-ci != 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Build and test on Windows
        if: runner.os == 'Windows'
        run: .\gradlew.bat --no-daemon :app:build

      - name: Build and test on macOS
        if: runner.os == 'macOS'
        run: ./gradlew --no-daemon :app:build

  publish-javadoc:
    name: Publish Javadoc to the Wiki
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: javadoc-wiki
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: javadoc-wiki

      - name: Update Wiki API reference
        shell: bash
        env:
          WIKI_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: '0'
        run: |
          authorization=$(printf 'x-access-token:%s' "$WIKI_TOKEN" | base64 -w0)
          echo "::add-mask::$authorization"
          export WIKI_AUTHORIZATION="Authorization: Basic $authorization"
          repo_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git_auth=(git "--config-env=http.$GITHUB_SERVER_URL/.extraheader=WIKI_AUTHORIZATION")

          main_head=$("${git_auth[@]}" ls-remote "$repo_url.git" "$GITHUB_REF")
          if [[ "${main_head%%$'\t'*}" != "$GITHUB_SHA" ]]; then
            echo "Skipping Wiki publication because main has moved."
            exit 0
          fi

          if ! "${git_auth[@]}" clone --depth 1 "$repo_url.wiki.git" wiki; then
            echo "::error::Could not clone the Wiki. Enable it and create its first page in GitHub if it is empty."
            exit 1
          fi

          page=wiki/API-Reference.md
          if [[ -e "$page" ]] && ! grep -Fxq '<!-- Generated from Javadoc. -->' "$page"; then
            echo "::error::The Wiki already has a hand-written API Reference page."
            exit 1
          fi
          cp API-Reference.md "$page"
          git -C wiki add -- API-Reference.md
          if git -C wiki diff --cached --quiet; then
            exit 0
          fi
          git -C wiki -c 'user.name=github-actions[bot]' \
            -c 'user.email=41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "Update Javadoc API reference"
          "${git_auth[@]}" -C wiki push

  release:
    name: Publish GitHub release
    needs: [verify, verify-desktop]
    if: >-
      !cancelled() &&
      github.event_name == 'push' && github.ref_type == 'tag' &&
      needs.verify.result == 'success' && needs.verify.outputs.release-commit != '' &&
      (needs.verify-desktop.result == 'success' ||
       (needs.verify-desktop.result == 'skipped' && needs.verify.outputs.reuse-ci == 'true'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: desktop-distribution

      - name: Publish verified distribution
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAGGED_COMMIT: ${{ needs.verify.outputs.release-commit }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          if [[ $(git rev-parse --verify "${GITHUB_REF}^{commit}") != "$TAGGED_COMMIT" ]] ||
             ! git merge-base --is-ancestor "$TAGGED_COMMIT" HEAD; then
            echo "::error::The tag changed or is no longer reachable from main."
            exit 1
          fi

          gh release create "$GITHUB_REF_NAME" DND.zip \
            --verify-tag --generate-notes --prerelease="$PRERELEASE"
